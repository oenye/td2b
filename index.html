<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Билды The Division 2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebee;--panel:#f6f7f8;--ink:#18212b;--mute:#566371;--line:#c3cad1;--acc:#d9500a;--accink:#fff;--ok:#1e7a46;--warn:#92650a;--bad:#a8322d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--panel:#1a2129;--ink:#e6eaee;--mute:#93a0ad;--line:#2d3743;--acc:#ff7a2e;--accink:#1a0e05;--ok:#4cc27f;--warn:#e0b341;--bad:#ef7b74}}
:root[data-theme="dark"]{--bg:#11161c;--panel:#1a2129;--ink:#e6eaee;--mute:#93a0ad;--line:#2d3743;--acc:#ff7a2e;--accink:#1a0e05;--ok:#4cc27f;--warn:#e0b341;--bad:#ef7b74}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;margin:0;font-weight:700}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;border-bottom:3px solid var(--acc);padding-bottom:14px;margin-bottom:20px}
h1{font-size:34px;line-height:1.1}
.ver{display:flex;gap:8px;align-items:center;color:var(--mute)}
.ver input{width:130px}
main{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px}
.panel h2{font-size:20px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:7px 9px;border-radius:2px}
textarea{resize:vertical;min-height:60px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:500 14px "IBM Plex Sans",sans-serif;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:2px}
button:hover{border-color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tools{display:grid;grid-template-columns:1fr 150px 150px;gap:10px;margin-bottom:14px}
@media(max-width:560px){.tools{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);padding:14px 16px;margin-bottom:12px}
.card.s-ok{border-left-color:var(--ok)}.card.s-test{border-left-color:var(--warn)}.card.s-old{border-left-color:var(--bad);opacity:.8}
.top{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
.card h3{font-size:21px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;border:1px solid var(--line);padding:1px 7px;color:var(--mute)}
.st{font-weight:500;font-size:13px;padding:2px 9px;border:1px solid currentColor}
.st.ok{color:var(--ok)}.st.test{color:var(--warn)}.st.old{color:var(--bad)}
dl{margin:10px 0 0;display:grid;grid-template-columns:110px 1fr;gap:4px 12px}
dt{color:var(--mute)}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);align-items:center}
.foot small{color:var(--mute)}.flag{color:var(--warn)}
.foot div{display:flex;gap:6px}
.empty{padding:30px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line)}
#io{display:none;margin-top:14px}#io textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sb{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;font-size:13px}
.sb svg,.em svg{width:22px;height:22px;display:block}
.em{display:inline-flex;gap:5px;align-items:center;margin:10px 12px 0 0;font-size:13px;color:var(--mute)}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pics .p{position:relative}
.pics img{width:96px;height:64px;object-fit:cover;border:1px solid var(--line);display:block;cursor:zoom-in}
.pics .x{position:absolute;top:2px;right:2px;padding:0 6px;background:var(--panel)}
svg.w{width:66px;height:22px;fill:currentColor}svg.w .m{fill-opacity:.55}svg.w .d{fill:none;stroke:var(--panel);stroke-width:1}svg.w .s{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
svg.a{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg.a .f{fill:currentColor;fill-opacity:.16}
.em.g{color:var(--ink)}.em.g small{color:var(--mute);font-size:13px}
.sb svg.w{width:51px;height:17px}.sb svg.a{width:24px;height:24px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#zoom img{max-width:100%;max-height:100%}
main{display:block}
.hd{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;flex:none}
.hr{display:flex;gap:16px;align-items:end;flex-wrap:wrap}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{display:flex;gap:8px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs b{font-weight:500;opacity:.7}
.tools{grid-template-columns:1fr 170px;margin:0}
@media(max-width:560px){.tools{grid-template-columns:1fr}}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:14px;padding-top:14px}
#list .card{margin:0;display:flex;flex-direction:column}
#list .card .foot{margin-top:auto}
.card:hover{border-top-color:var(--mute);border-right-color:var(--mute);border-bottom-color:var(--mute)}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--mute);font-size:13px}
details dl{margin-top:8px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:20;overflow:auto;border-width:0 0 0 1px;transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#drawer.open{transform:none;visibility:visible}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;display:none}#scrim.open{display:block}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.dh button{padding:2px 11px;font-size:20px;line-height:1.2}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#drawer,#toast{transition:none}}
.armor{display:grid;gap:5px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.ar{display:grid;grid-template-columns:24px 92px 1fr;gap:8px;align-items:center;font-size:13.5px;line-height:1.35}
.ar svg.a{width:24px;height:24px}.al{color:var(--mute)}
.al2{display:flex;align-items:center;gap:6px}.al2 svg.a{width:20px;height:20px}
.core{width:20px;height:20px;flex:none}
.cv{display:flex;gap:7px;align-items:center}
.cs{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;align-items:center;margin-bottom:4px}
.cs b{font-weight:500;color:var(--mute)}.cs span{display:inline-flex;gap:6px;align-items:center}
.cr{display:grid;grid-template-columns:1fr 112px;gap:8px}
.ro #newb,.ro .card .foot div{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.on{display:flex}.modal .panel{max-width:480px;width:100%}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="hd"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="var(--acc)"/><path d="M12 25l8-12 8 12M15.500 25h9" stroke="var(--accink)" stroke-width="2.500" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div><h1>Билды The Division 2</h1><div id="count" style="color:var(--mute)"></div><div id="sync" style="color:var(--mute);font-size:13px"></div></div></div>
  <div class="hr"><div class="ver"><label for="curver" style="margin:0">Текущее обновление</label><input id="curver" placeholder="например, Y8S3"></div><button id="upb" type="button" hidden>Обновления</button><button id="ups" type="button" hidden aria-label="Настройки обновлений">⚙</button><button id="fsb" type="button" hidden>Папка синхронизации</button><button class="pri" id="newb" type="button">+ Новый билд</button></div>
</header>
<main>
  <div id="scrim"></div>
  <section class="panel" id="drawer" aria-labelledby="ft">
    <div class="dh"><h2 id="ft" style="margin:0">Новый билд</h2><button type="button" id="cl" aria-label="Закрыть">×</button></div>
    <label for="f-name">Название</label><input id="f-name">
    <div class="row">
      <div><label for="f-role">Роль</label><select id="f-role"><option>Урон</option><option>Танк</option><option>Лечение</option><option>Навыки</option><option>Гибрид</option></select></div>
      <div><label for="f-mode">Режим</label><select id="f-mode"><option>PvE</option><option>PvP</option><option>Рейд</option><option>Любой</option></select></div>
    </div>
    <label for="f-sets">Бренды и сеты</label><input id="f-sets">
    <div class="sets" id="setbtns" aria-label="Быстро добавить сет"></div>
    <label for="f-weap">Оружие</label><textarea id="f-weap"></textarea>
    <div class="sets" id="wbtns" aria-label="Добавить тип оружия"></div>
    <div id="armorf"></div>
    <label for="f-tal">Специализация, моды, навыки</label><textarea id="f-tal"></textarea>
    <label for="f-note">Заметки</label><textarea id="f-note"></textarea>
    <label for="f-pics">Скриншоты экипировки</label><input id="f-pics" type="file" accept="image/*" multiple>
    <div class="pics" id="fp"></div><div id="msg" role="status" style="color:var(--bad);font-size:13px;margin-top:6px"></div>
    <div class="row">
      <div><label for="f-ver">Проверен для</label><input id="f-ver" placeholder="Y8S3"></div>
      <div><label for="f-status">Статус</label><select id="f-status"><option value="ok">Актуален</option><option value="test">Тестирую</option><option value="old">Устарел</option></select></div>
    </div>
    <div class="actions"><button class="pri" id="save">Сохранить билд</button><button id="reset">Очистить</button></div>
    <div class="actions"><button id="exp">Экспорт</button><button id="imp">Импорт</button></div>
    <div id="io"><textarea id="iotext" aria-label="JSON с билдами"></textarea><div class="actions"><button class="pri" id="ioapply">Загрузить из текста</button></div></div>
  </section>
  <section aria-label="Список билдов">
    <div class="bar">
      <div class="tabs" id="tabs"><button type="button" data-s="">Все <b>0</b></button><button type="button" data-s="ok">Актуальные <b>0</b></button><button type="button" data-s="test">Тестирую <b>0</b></button><button type="button" data-s="old">Устаревшие <b>0</b></button></div>
      <select id="fs" hidden><option value=""></option><option value="ok"></option><option value="test"></option><option value="old"></option></select>
      <div class="tools"><input id="q" placeholder="Поиск по названию, оружию, сетам" aria-label="Поиск">
      <select id="fr" aria-label="Роль"><option value="">Все роли</option><option>Урон</option><option>Танк</option><option>Лечение</option><option>Навыки</option><option>Гибрид</option></select></div>
    </div>
    <div id="list"></div>
  </section>
</main>
</div>
<div class="modal" id="updm"><div class="panel" role="dialog" aria-labelledby="ut"><h2 id="ut">Обновления</h2><div id="uv" style="color:var(--mute)"></div>
<label for="uurl">Адрес обновлений (https)</label><input id="uurl" placeholder="https://raw.githubusercontent.com/пользователь/репозиторий/main/">
<div class="actions"><button class="pri" id="usave" type="button">Сохранить и проверить</button><button class="pri" id="uapp" type="button" hidden>Обновить</button><button id="ucl" type="button">Закрыть</button></div>
<div id="ust" role="status" style="margin-top:10px"></div></div></div>
<div id="toast" role="status"></div>
<div id="zoom"><img alt=""></div>
<script>
const K='d2builds.v1';
let DB=null,FS=window.d2sync||null,fsOn=false,sst;
let S={ver:'',builds:[]};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
if(!S||!Array.isArray(S.builds))S={ver:'',builds:[]};
const $=id=>document.getElementById(id);
const save=()=>{if(DB)return true;let ok=true;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){ok=false}syncSoon();return ok};
const maxP=()=>DB?3:6;
const dbErr=e=>toast(e&&e.code==='invalid_argument'?'Нет прав на изменение или билд слишком большой (уберите часть фото)':e&&e.code==='quota_exceeded'?'Общее хранилище заполнено':'Не удалось сохранить в общую базу');
const dbPut=b=>{if(DB)DB.doc('builds/'+b.id).set(JSON.parse(JSON.stringify(b))).catch(dbErr)};
const dbDel=id=>{if(DB)DB.doc('builds/'+id).delete().catch(dbErr)};
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={ok:'Актуален',test:'Тестирую',old:'Устарел'};
const F=['name','role','mode','sets','weap','mask','maskc','chest','chestc','pack','packc','gloves','glovesc','holster','holsterc','knees','kneesc','tal','note','ver','status'];
let editId=null;

function clearForm(){
  F.forEach(k=>{const e=$('f-'+k);e.value=e.tagName==='SELECT'?e.options[0].value:''});
  $('f-ver').value=S.ver;editId=null;pics=[];renderFP();$('msg').textContent='';$('ft').textContent='Новый билд';$('save').textContent='Сохранить билд';
}
function render(){
  const q=$('q').value.trim().toLowerCase(),fs=$('fs').value,fr=$('fr').value;
  const cnt={'':S.builds.length,ok:0,test:0,old:0};S.builds.forEach(b=>{if(b.status in cnt)cnt[b.status]++});
  document.querySelectorAll('#tabs button').forEach(t=>{t.querySelector('b').textContent=cnt[t.dataset.s];t.setAttribute('aria-pressed',String(t.dataset.s===fs))});
  const rank={ok:0,test:1,old:2};
  const items=S.builds.filter(b=>(!fs||b.status===fs)&&(!fr||b.role===fr)&&(!q||[b.name,b.sets,b.weap,b.tal,b.note].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>rank[a.status]-rank[b.status]||String(b.checked).localeCompare(String(a.checked)));
  $('count').textContent='Всего билдов: '+S.builds.length+', актуальных: '+S.builds.filter(b=>b.status==='ok').length;
  if(!items.length){$('list').innerHTML='<div class="empty">'+(S.builds.length?'Ничего не найдено. Сбросьте фильтры.':'Билдов пока нет. Нажмите «Новый билд», чтобы добавить первый.')+'</div>';return}
  $('list').innerHTML=items.map(b=>{
    const stale=S.ver&&b.ver!==S.ver&&b.status!=='old';
    const row=(t,v)=>v?'<dt>'+t+'</dt><dd>'+esc(v)+'</dd>':'';
    return '<article class="card s-'+b.status+'"><div class="top"><div><h3>'+esc(b.name||'Без названия')+'</h3><div class="tags"><span class="tag">'+esc(b.role)+'</span><span class="tag">'+esc(b.mode)+'</span></div></div><span class="st '+b.status+'">'+ST[b.status]+'</span></div>'+
    emRow(b)+gearRow(b)+'<details><summary>Состав и заметки</summary><dl>'+row('Бренды и сеты',b.sets)+row('Оружие',b.weap)+row('Специализация, моды, навыки',b.tal)+row('Заметки',b.note)+'</dl></details>'+picRow(b)+
    '<div class="foot"><small>Проверен для '+esc(b.ver||'—')+', '+esc(b.checked)+(stale?' <span class="flag">Вышло новое обновление, перепроверьте билд</span>':'')+'</small>'+
    '<div><button data-a="chk" data-id="'+b.id+'">Подтвердить</button><button data-a="edit" data-id="'+b.id+'">Изменить</button><button data-a="del" data-id="'+b.id+'">Удалить</button></div></div></article>';
  }).join('');
}
$('save').onclick=()=>{
  const o={};F.forEach(k=>o[k]=$('f-'+k).value.trim());o.pics=pics.slice();o.u=Date.now();
  if(!o.name){$('f-name').focus();return}
  let nb;
  if(editId){const b=S.builds.find(x=>x.id===editId);Object.assign(b,o,{checked:today()});nb=b}
  else{nb=Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),checked:today()},o);S.builds.push(nb)}
  if(!save()){$('msg').textContent='Не хватило места в браузере. Удалите часть фото и сохраните снова.';return}
  dbPut(nb);
  toast(editId?'Билд обновлён':'Билд сохранён');closeD();clearForm();render();
};
$('reset').onclick=clearForm;
$('list').onclick=e=>{
  if(e.target.dataset.z){$('zoom').firstElementChild.src=e.target.src;$('zoom').style.display='flex';return}
  const t=e.target.closest('button');if(!t)return;
  const b=S.builds.find(x=>x.id===t.dataset.id);if(!b)return;
  if(t.dataset.a==='chk'){b.ver=S.ver||b.ver;b.checked=today();if(b.status==='old')b.status='ok';b.u=Date.now();save();dbPut(b);render();toast('Актуальность подтверждена')}
  if(t.dataset.a==='del'){if(t.dataset.sure){S.builds=S.builds.filter(x=>x!==b);(S.tomb=S.tomb||[]).push({id:b.id,u:Date.now()});save();dbDel(b.id);render()}else{t.textContent='Точно удалить?';t.dataset.sure='1'}}
  if(t.dataset.a==='edit'){F.forEach(k=>$('f-'+k).value=b[k]||'');editId=b.id;pics=(b.pics||[]).slice();renderFP();$('ft').textContent='Изменение билда';$('save').textContent='Сохранить изменения';openD()}
};
$('curver').value=S.ver;
$('curver').oninput=e=>{S.ver=e.target.value.trim();S.vu=Date.now();save();render();clearTimeout(window._vt);window._vt=setTimeout(()=>{if(DB)DB.doc('meta/config').set({ver:S.ver}).catch(dbErr)},600)};
['q','fs','fr'].forEach(id=>$(id).addEventListener('input',render));
$('exp').onclick=()=>{$('io').style.display='block';$('iotext').value=JSON.stringify(S,null,1);$('iotext').select()};
$('imp').onclick=()=>{$('io').style.display='block';$('iotext').value='';$('iotext').placeholder='Вставьте сюда JSON из экспорта';$('iotext').focus()};
$('ioapply').onclick=()=>{
  try{const d=JSON.parse($('iotext').value);if(!d||!Array.isArray(d.builds))throw 0;if(FS&&fsOn){const t=Date.now(),m=new Map(S.builds.map(b=>[b.id,b]));d.builds.forEach(b=>{if(b&&b.id){b.u=t;m.set(b.id,b)}});S.builds=[...m.values()];if(d.ver){S.ver=d.ver;S.vu=t}}else S={ver:d.ver||'',builds:d.builds};save();if(DB){S.builds.forEach(b=>dbPut(b));if(S.ver)DB.doc('meta/config').set({ver:S.ver}).catch(dbErr)}$('curver').value=S.ver;$('io').style.display='none';clearForm();render()}
  catch(e){$('iotext').value='';$('iotext').placeholder='Не удалось прочитать JSON. Вставьте текст, полученный через «Экспорт».'}
};

let pics=[];

  }catch(e){}
})();
const idSort=(a,b)=>a.id<b.id?-1:a.id>b.id?1:0;
function mergeState(list){
  const m=new Map(),t=new Map();let ver={v:'',u:0};
  list.forEach(st=>{
    if(!st)return;
    (st.builds||[]).forEach(b=>{if(!b||!b.id)return;const o=m.get(b.id);if(!o||(b.u||0)>(o.u||0))m.set(b.id,b)});
    (st.tomb||[]).forEach(x=>{if(!x||!x.id)return;const o=t.get(x.id);if(!o||x.u>o.u)t.set(x.id,x)});
    if(st.ver&&st.ver.u>ver.u)ver={v:st.ver.v,u:st.ver.u};
  });
  t.forEach((x,id)=>{const b=m.get(id);if(b&&(b.u||0)<=x.u)m.delete(id)});
  return{builds:[...m.values()].sort(idSort),tomb:[...t.values()].sort(idSort),ver};
}
let lastW='';
const sy=t=>{$('sync').textContent=t};
function syncSoon(){if(FS&&fsOn){clearTimeout(sst);sst=setTimeout(syncNow,400)}}
async function syncNow(){
  if(!FS||!fsOn)return;
  try{
    const others=await FS.read();
    const cur={builds:S.builds,tomb:S.tomb||[],ver:{v:S.ver,u:S.vu||0}};
    const m=mergeState([cur].concat(others));
    const mine=JSON.stringify(mergeState([cur]));
    const next=JSON.stringify(m);
    if(next!==mine){
      S.builds=m.builds;S.tomb=m.tomb;
      if(m.ver.u>(S.vu||0)){S.ver=m.ver.v;S.vu=m.ver.u;if(document.activeElement!==$('curver'))$('curver').value=S.ver}
      try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
      render();
    }
    if(next!==lastW){await FS.write(m);lastW=next}
    const c=await FS.getConfig();
    sy('Синхронизация через папку: '+c.folder+' (обновлено '+new Date().toTimeString().slice(0,5)+', участников: '+(others.length+1)+')');
  }catch(e){sy('Папка синхронизации недоступна. Проверьте, что она существует, и выберите её заново.')}
}
(async()=>{
  if(!FS)return;
  $('fsb').hidden=false;
  $('fsb').onclick=async()=>{const f=await FS.chooseFolder();if(f){fsOn=true;lastW='';syncNow()}};
  try{
    const c=await FS.getConfig();
    FS.onChange(()=>syncNow());
    setInterval(syncNow,20000);
    if(c.folder){fsOn=true;syncNow()}else sy('Папка синхронизации не выбрана: билды хранятся только на этом компьютере. Нажмите «Папка синхронизации».');
  }catch(e){}
})();

const UP=window.d2upd||null;let upNew=null;
async function upCheck(manual){
  const r=await UP.check();
  if(!r.ok){if(manual)$('ust').textContent=r.error==='no_url'?'Укажите адрес обновлений.':'Не удалось проверить обновления: '+r.error+'.';return}
  $('uapp').hidden=!r.available;
  if(r.available){
    upNew=r;$('upb').textContent='Обновить до v'+r.version;$('upb').classList.add('pri');
    if(manual)$('ust').textContent='Доступна версия '+r.version+(r.notes?': '+r.notes:'')+'.';else toast('Доступно обновление v'+r.version);
  }else{
    upNew=null;$('upb').textContent='Обновления';$('upb').classList.remove('pri');
    if(manual)$('ust').textContent='У вас последняя версия ('+r.current+').';
  }
}
async function doUpdate(){
  if(!upNew)return;
  $('upb').disabled=true;$('upb').textContent='Обновление…';$('updm').classList.remove('on');
  let r;try{r=await UP.apply(JSON.stringify(S))}catch(e){r={ok:false,error:'ошибка'}}
  if(!r.ok){$('upb').disabled=false;$('upb').textContent='Обновить до v'+upNew.version;toast('Не удалось обновить: '+r.error)}
}
(async()=>{
  if(!UP)return;
  $('upb').hidden=false;$('ups').hidden=false;
  try{const i=await UP.info();$('uv').textContent='Версия приложения: '+i.version;$('uurl').value=i.url||''}catch(e){}
  const open=()=>{$('ust').textContent='';$('updm').classList.add('on')};
  $('upb').onclick=()=>upNew?doUpdate():(open(),$('uurl').value?upCheck(true):0);
  $('ups').onclick=open;$('ucl').onclick=()=>$('updm').classList.remove('on');
  $('uapp').onclick=doUpdate;
  $('usave').onclick=async()=>{const r=await UP.setUrl($('uurl').value);if(!r.ok){$('ust').textContent=r.error;return}$('uurl').value=r.url;upCheck(true)};
  setTimeout(()=>upCheck(false),3000);setInterval(()=>upCheck(false),6*3600*1000);
})();
clearForm();render();
</script>
