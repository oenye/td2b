<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Билды The Division 2</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--panel:#141416;--panel2:#1b1b1f;--ink:#f3f3f4;--mute:#9b9ba3;--line:#2b2b30;--acc:#e3b93c;--accink:#16120a;--ok:#4cc27f;--warn:#e0b341;--bad:#ef7b74;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]):not([data-theme="light"]){--bg:#eef0f2;--panel:#fff;--panel2:#f3f4f6;--ink:#16181c;--mute:#5d6672;--line:#d0d5db;--acc:#a97c00;--accink:#fff;--ok:#1e7a46;--warn:#92650a;--bad:#a8322d}}
:root[data-theme="light"]{--bg:#eef0f2;--panel:#fff;--panel2:#f3f4f6;--ink:#16181c;--mute:#5d6672;--line:#d0d5db;--acc:#a97c00;--accink:#fff;--ok:#1e7a46;--warn:#92650a;--bad:#a8322d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;margin:0;font-weight:700}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:600 14px "IBM Plex Sans",sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 14px;border-radius:8px}
button:hover{border-color:var(--mute)}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);padding:9px 11px;border-radius:8px}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{max-width:1500px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;flex:none}
.brand b{display:block;font:700 20px/1.1 "IBM Plex Sans Condensed",sans-serif}.brand b span{color:var(--acc)}.brand small{color:var(--mute);font-size:12px}
.ver{display:flex;gap:8px;align-items:center;font-size:13px}.ver label{margin:0;font-weight:500;color:var(--mute)}.ver input{width:96px;padding:6px 9px}
.tr{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;max-width:1500px;margin:0 auto;padding:24px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:16px}.side{position:static!important;max-height:none!important}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-size:20px;margin-bottom:6px}
.side{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto}
.sh{display:flex;justify-content:space-between;align-items:center}.lnk{background:none;border:0;color:var(--mute);padding:0;font-weight:500}.lnk:hover{color:var(--ink)}
.sl{max-height:240px;overflow:auto;margin-top:8px;display:grid;gap:2px}
.ck{display:flex;align-items:center;gap:8px;padding:5px 4px;margin:0;font-weight:500;cursor:pointer}.ck input{width:auto}.cm svg{width:20px;height:20px;display:block}
.stat{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{padding:10px 18px;border-radius:10px;background:var(--panel)}
.tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink)}.tabs b{opacity:.65;font-weight:600;margin-left:6px}
.sbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin:18px 0}
.sbar svg{width:20px;height:20px;flex:none;color:var(--mute)}.sbar input{border:0;background:transparent;font-size:16px;padding:16px 4px}.sbar input:focus-visible{outline:0}
.ph{font-size:34px;margin:28px 0 4px}.ph span{color:var(--acc)}
#showing{color:var(--mute);margin-bottom:20px}#showing b{color:var(--ink)}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--mute)}.card.s-old{opacity:.8}
.shot{position:relative;aspect-ratio:16/10;background:#0a0a0c;overflow:hidden}.shot>img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.art{width:100%;height:100%;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at 50% 40%,#26262c,#0a0a0c 72%)}
.art .wm{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 12px;font:800 clamp(30px,5vw,58px)/1.05 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.1em;color:#fff;opacity:.06}
.art svg.w{position:relative;width:78%;height:auto;color:var(--acc)}
.badge,.shot .st{position:absolute;top:12px;background:rgba(0,0,0,.66);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:700}
.badge{right:12px;color:#fff}.shot .st{left:12px;border:0}
.st.ok{color:var(--ok)}.st.test{color:var(--warn)}.st.old{color:var(--bad)}
.cb{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.cb h3{font-size:21px;line-height:1.2}.by{color:var(--mute);font-size:14px}.by i{font-style:normal;opacity:.5;margin:0 5px}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.cd{min-width:0}.cd small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.cd span{display:block;font:13px ui-monospace,Consolas,monospace;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{padding:7px 9px;display:grid;place-items:center}
.m4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:12px;color:var(--mute);min-height:38px;flex-direction:column}
.mc.r{flex-direction:row}.mc b{color:var(--ink);font-size:13px}.mc small{font-size:10px;font-weight:700;letter-spacing:.05em}.mc .core{width:18px;height:18px}
details{border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;color:var(--mute);font-size:13px}
dl{margin:10px 0 0;display:grid;grid-template-columns:110px 1fr;gap:4px 12px}dt{color:var(--mute)}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.foot small{color:var(--mute)}.flag{color:var(--warn)}.ac{display:flex;gap:6px;flex-wrap:wrap}.ac button{padding:5px 10px;font-size:13px}
.empty{grid-column:1/-1;padding:40px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.pg{display:flex;gap:14px;align-items:center;justify-content:center;margin:26px 0;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
svg.w{width:66px;height:22px;fill:currentColor}svg.w .m{fill-opacity:.55}svg.w .d{fill:none;stroke:var(--panel);stroke-width:1}svg.w .s{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
svg.a{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg.a .f{fill:currentColor;fill-opacity:.16}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sb{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;font-size:13px}
.sb svg,.em svg{width:22px;height:22px;display:block}.sb svg.w{width:51px;height:17px}.sb svg.a{width:24px;height:24px}
.em{display:inline-flex;gap:5px;align-items:center;margin:10px 12px 0 0;font-size:13px;color:var(--mute)}.em.g{color:var(--ink)}.em.g small{color:var(--mute);font-size:13px}
svg.w.in{width:66px;height:22px}
.armor{display:grid;gap:5px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.ar{display:grid;grid-template-columns:24px 92px 1fr;gap:8px;align-items:center;font-size:13.5px;line-height:1.35}.ar svg.a{width:24px;height:24px}.al{color:var(--mute)}
.al2{display:flex;align-items:center;gap:6px}.al2 svg.a{width:20px;height:20px}
.core{width:20px;height:20px;flex:none}.cv{display:flex;gap:7px;align-items:center}
.cs{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;align-items:center;margin-bottom:4px}.cs b{font-weight:500;color:var(--mute)}.cs span{display:inline-flex;gap:6px;align-items:center}
.cr{display:grid;grid-template-columns:1fr 112px;gap:8px}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pics .p{position:relative}
.pics img{width:96px;height:64px;object-fit:cover;border:1px solid var(--line);border-radius:6px;display:block;cursor:zoom-in}
.pics .x{position:absolute;top:2px;right:2px;padding:0 6px;background:var(--panel)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:20;overflow:auto;border-radius:0;border-width:0 0 0 1px;transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#drawer.open{transform:none;visibility:visible}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19;display:none}#scrim.open{display:block}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.dh button{padding:2px 11px;font-size:20px;line-height:1.2}
#io{display:none;margin-top:14px}#io textarea{min-height:140px;font-family:ui-monospace,monospace;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}.modal.on{display:flex}.modal .panel{max-width:480px;width:100%}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}#zoom img{max-width:100%;max-height:100%}
.ro #newb,.ro .card .foot div{display:none}
@media(prefers-reduced-motion:reduce){#drawer,#toast{transition:none}}
</style>
</head>
<body>
<div class="top"><div class="topin">
  <div class="brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="var(--acc)"/><path d="M12 25l8-12 8 12M15.500 25h9" stroke="var(--accink)" stroke-width="2.500" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>D2 <span>Builder</span></b><small>База билдов The Division 2</small></div></div>
  <div class="ver"><label for="curver">Текущее обновление</label><input id="curver" placeholder="Y8S3"></div>
  <div class="tr"><button id="thb" type="button">Тема: авто</button><button id="upb" type="button" hidden>Обновления</button><button id="ups" type="button" hidden aria-label="Настройки обновлений">⚙</button><button id="fsb" type="button" hidden>Папка синхронизации</button><button class="pri" id="newb" type="button">+ Новый билд</button></div>
</div></div>
<div class="layout">
  <aside class="panel side" aria-label="Фильтры">
    <div class="sh"><h2>Фильтры</h2><button class="lnk" id="clr" type="button">Очистить всё</button></div>
    <label for="fr">Роль</label><select id="fr"><option value="">Все роли</option><option>Урон</option><option>Танк</option><option>Лечение</option><option>Навыки</option><option>Гибрид</option></select>
    <label for="fm">Режим</label><select id="fm"><option value="">Все режимы</option><option>PvE</option><option>PvP</option><option>Рейд</option><option>Любой</option></select>
    <label for="fw">Тип оружия</label><select id="fw"></select>
    <label id="slh" for="sq">Сеты</label><input id="sq" placeholder="Найти сет…"><div class="sl" id="sl"></div>
    <label for="so">Сортировка</label><select id="so"><option value="st">Сначала актуальные</option><option value="nm">По названию</option><option value="dt">Свежие проверки сверху</option></select>
    <div class="stat"><div id="count"></div><div id="sync" style="margin-top:6px"></div></div>
  </aside>
  <section class="content" aria-label="Список билдов">
    <div class="tabs" id="tabs"><button type="button" data-s="">Все <b>0</b></button><button type="button" data-s="ok">Актуальные <b>0</b></button><button type="button" data-s="test">Тестирую <b>0</b></button><button type="button" data-s="old">Устаревшие <b>0</b></button></div>
    <select id="fs" hidden><option value=""></option><option value="ok"></option><option value="test"></option><option value="old"></option></select>
    <div class="sbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Поиск билдов: название, оружие, сеты…" aria-label="Поиск"></div>
    <h2 class="ph">Все <span>билды</span></h2><div id="showing"></div>
    <div id="list"></div><div class="pg" id="pg"></div>
  </section>
</div>
<div id="scrim"></div>
<section class="panel" id="drawer" aria-labelledby="ft">
    <div class="dh"><h2 id="ft" style="margin:0">Новый билд</h2><button type="button" id="cl" aria-label="Закрыть">×</button></div>
    <label for="f-name">Название</label><input id="f-name">
    <div class="row">
      <div><label for="f-role">Роль</label><select id="f-role"><option>Урон</option><option>Танк</option><option>Лечение</option><option>Навыки</option><option>Гибрид</option></select></div>
      <div><label for="f-mode">Режим</label><select id="f-mode"><option>PvE</option><option>PvP</option><option>Рейд</option><option>Любой</option></select></div>
    </div>
    <label for="f-sets">Бренды и сеты</label><input id="f-sets">
    <div class="sets" id="setbtns" aria-label="Быстро добавить сет"></div>
    <label for="f-weap">Оружие</label><textarea id="f-weap"></textarea>
    <div class="sets" id="wbtns" aria-label="Добавить тип оружия"></div>
    <div id="armorf"></div>
    <label for="f-tal">Специализация, моды, навыки</label><textarea id="f-tal"></textarea>
    <label for="f-note">Заметки</label><textarea id="f-note"></textarea>
    <label for="f-pics">Скриншоты экипировки <span style="font-weight:400;color:var(--mute)">(или Ctrl+V из буфера)</span></label><input id="f-pics" type="file" accept="image/*" multiple>
    <div class="pics" id="fp"></div><div id="msg" role="status" style="color:var(--bad);font-size:13px;margin-top:6px"></div>
    <div class="row">
      <div><label for="f-ver">Проверен для</label><input id="f-ver" placeholder="Y8S3"></div>
      <div><label for="f-status">Статус</label><select id="f-status"><option value="ok">Актуален</option><option value="test">Тестирую</option><option value="old">Устарел</option></select></div>
    </div>
    <div class="actions"><button class="pri" id="save">Сохранить билд</button><button id="reset">Очистить</button></div>
    <div class="actions"><button id="expf" type="button">Экспорт в файл</button><button id="impf" type="button">Импорт из файла</button><input id="impfile" type="file" accept=".json,application/json" hidden></div>
    <div class="actions"><button id="exp" type="button">Экспорт текстом</button><button id="imp" type="button">Импорт текстом</button></div>
    <div id="io"><textarea id="iotext" aria-label="JSON с билдами"></textarea><div class="actions"><button class="pri" id="ioapply">Загрузить из текста</button></div></div>
  </section>
<div class="modal" id="updm"><div class="panel" role="dialog" aria-labelledby="ut"><h2 id="ut">Обновления</h2><div id="uv" style="color:var(--mute)"></div>
<label for="uurl">Адрес обновлений (https)</label><input id="uurl" placeholder="https://raw.githubusercontent.com/пользователь/репозиторий/main/">
<div class="actions"><button class="pri" id="usave" type="button">Сохранить и проверить</button><button class="pri" id="uapp" type="button" hidden>Обновить</button><button id="ucl" type="button">Закрыть</button></div>
<div id="ust" role="status" style="margin-top:10px"></div></div></div>
<div id="toast" role="status"></div>
<div id="zoom"><img alt=""></div>
<script>
const K='d2builds.v1';
let DB=null,FS=window.d2sync||null,fsOn=false,sst;
let S={ver:'',builds:[]};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
if(!S||!Array.isArray(S.builds))S={ver:'',builds:[]};
const $=id=>document.getElementById(id);
const save=()=>{if(DB)return true;let ok=true;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){ok=false}syncSoon();return ok};
const maxP=()=>DB?3:6;
const dbErr=e=>toast(e&&e.code==='invalid_argument'?'Нет прав на изменение или билд слишком большой (уберите часть фото)':e&&e.code==='quota_exceeded'?'Общее хранилище заполнено':'Не удалось сохранить в общую базу');
const dbPut=b=>{if(DB)DB.doc('builds/'+b.id).set(JSON.parse(JSON.stringify(b))).catch(dbErr)};
const dbDel=id=>{if(DB)DB.doc('builds/'+id).delete().catch(dbErr)};
const today=()=>new Date().toISOString().slice(0,10);
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={ok:'Актуален',test:'Тестирую',old:'Устарел'};
const F=['name','role','mode','sets','weap','mask','maskc','chest','chestc','pack','packc','gloves','glovesc','holster','holsterc','knees','kneesc','tal','note','ver','status'];
let editId=null;

function clearForm(){
  F.forEach(k=>{const e=$('f-'+k);e.value=e.tagName==='SELECT'?e.options[0].value:''});
  $('f-ver').value=S.ver;editId=null;pics=[];renderFP();$('msg').textContent='';$('ft').textContent='Новый билд';$('save').textContent='Сохранить билд';
}
const PS=9;let page=1;const selSets=new Set();
const COPYSVG='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>';
const wkey=b=>{const w=(b.weap||'')+' '+(b.name||'');const t=WT.find(t=>t[2].test(w));return t?t[0]:''};
const fmtD=d=>{const m=String(d||'').match(/^(\d{4})-(\d\d)-(\d\d)/);return m?m[3]+'.'+m[2]:'—'};
function buildText(b){
  const L=[(b.name||'Билд')+' ('+b.role+', '+b.mode+(b.ver?', '+b.ver:'')+')'];
  if(b.sets)L.push('Сеты: '+b.sets);if(b.weap)L.push('Оружие: '+String(b.weap).replace(/\n/g,'; '));
  AS.forEach(a=>{const o=coreOf(b,a[0]);if(o.t||o.c)L.push(a[1]+': '+(o.t||'—')+(o.c?' ['+CORES[o.c][0]+' ядро]':''))});
  if(b.tal)L.push(b.tal);if(b.note)L.push('Заметки: '+b.note);
  return L.join('\n');
}
function fbCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).catch(()=>fbCopy(t));else fbCopy(t)}
function cardHtml(b){
  const stale=S.ver&&b.ver!==S.ver&&b.status!=='old';
  const s0=SETS.find(s=>norm(b.sets).includes(norm(s[0])));

function importData(txt){

  S.builds=[...m.values()];
  const ids=new Set(d.builds.map(b=>b&&b.id));if(S.tomb)S.tomb=S.tomb.filter(x=>!ids.has(x.id));
  if(typeof d.ver==='string'&&d.ver&&!S.ver){S.ver=d.ver;S.vu=t}
  save();if(DB){d.builds.forEach(b=>b&&b.id&&dbPut(b));if(S.ver)DB.doc('meta/config').set({ver:S.ver}).catch(dbErr)}

}

const idSort=(a,b)=>a.id<b.id?-1:a.id>b.id?1:0;
function mergeState(list){
  const m=new Map(),t=new Map();let ver={v:'',u:0};
  list.forEach(st=>{
    if(!st)return;
    (st.builds||[]).forEach(b=>{if(!b||!b.id)return;const o=m.get(b.id);if(!o||(b.u||0)>(o.u||0))m.set(b.id,b)});
    (st.tomb||[]).forEach(x=>{if(!x||!x.id)return;const o=t.get(x.id);if(!o||x.u>o.u)t.set(x.id,x)});
    if(st.ver&&st.ver.u>ver.u)ver={v:st.ver.v,u:st.ver.u};
  });
  t.forEach((x,id)=>{const b=m.get(id);if(b&&(b.u||0)<=x.u)m.delete(id)});
  return{builds:[...m.values()].sort(idSort),tomb:[...t.values()].sort(idSort),ver};
}

async function syncNow(){
  if(!FS||!fsOn)return;
  try{
    const others=await FS.read();
    const cur={builds:S.builds,tomb:S.tomb||[],ver:{v:S.ver,u:S.vu||0}};
    const m=mergeState([cur].concat(others));
    const mine=JSON.stringify(mergeState([cur]));
    const next=JSON.stringify(m);
    if(next!==mine){
      S.builds=m.builds;S.tomb=m.tomb;
      if(m.ver.u>(S.vu||0)){S.ver=m.ver.v;S.vu=m.ver.u;if(document.activeElement!==$('curver'))$('curver').value=S.ver}
      try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
      render();
    }
    if(next!==lastW){await FS.write(m);lastW=next}
    const c=await FS.getConfig();
    sy('Синхронизация через папку: '+c.folder+' (обновлено '+new Date().toTimeString().slice(0,5)+', участников: '+(others.length+1)+')');
  }catch(e){sy('Папка синхронизации недоступна. Проверьте, что она существует, и выберите её заново.')}

const UP=window.d2upd||null;let upNew=null;
async function upCheck(manual){
  const r=await UP.check();
  if(!r.ok){if(manual)$('ust').textContent=r.error==='no_url'?'Укажите адрес обновлений.':'Не удалось проверить обновления: '+r.error+'.';return}
  $('uapp').hidden=!r.available;
  if(r.available){
    upNew=r;$('upb').textContent='Обновить до v'+r.version;$('upb').classList.add('pri');
    if(manual)$('ust').textContent='Доступна версия '+r.version+(r.notes?': '+r.notes:'')+'.';else toast('Доступно обновление v'+r.version);
  }else{
    upNew=null;$('upb').textContent='Обновления';$('upb').classList.remove('pri');
    if(manual)$('ust').textContent='У вас последняя версия ('+r.current+').';
  }
}
async function doUpdate(){
  if(!upNew)return;
  $('upb').disabled=true;$('upb').textContent='Обновление…';$('updm').classList.remove('on');
  let r;try{r=await UP.apply(JSON.stringify(S))}catch(e){r={ok:false,error:'ошибка'}}
  if(!r.ok){$('upb').disabled=false;$('upb').textContent='Обновить до v'+upNew.version;toast('Не удалось обновить: '+r.error)}
}
(async()=>{
  if(!UP)return;

  try{const i=await UP.info();$('uv').textContent='Версия приложения: '+i.version;$('uurl').value=i.url||''}catch(e){}
  const open=()=>{$('ust').textContent='';$('updm').classList.add('on')};
  $('upb').onclick=()=>upNew?doUpdate():(open(),$('uurl').value?upCheck(true):0);
  $('ups').onclick=open;$('ucl').onclick=()=>$('updm').classList.remove('on');
  $('uapp').onclick=doUpdate;

  setTimeout(()=>upCheck(false),3000);setInterval(()=>upCheck(false),6*3600*1000);
})();
